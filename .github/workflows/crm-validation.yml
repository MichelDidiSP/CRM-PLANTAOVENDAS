name: Validar CRM
on:
  pull_request:
  push:
    branches:
      - 'codex/orquestracao-recepcao-fechamento'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirmar módulos congelados
        run: git diff --exit-code 95ac905c1b5d694a9352ddba308e4501f7572714 HEAD -- src/lib/queue/coreDistribution.ts src/lib/queue/shiftSchedule.ts src/lib/queue/pauseAndPartners.ts src/lib/reception/intake.ts
      - name: Confirmar orquestrador e testes originais da PR 6
        run: git diff --exit-code ad3f552f1a76b6632d80a96aeaf482763af3c8d2 HEAD -- src/lib/reception/fallbackOrchestrator.ts 'src/lib/**/*.test.ts' src/lib/queueEngine.test.ts
      - name: Confirmar testes do módulo TESTE da PR 8
        run: git diff --exit-code e29222140e424ad77a9fb3b80c991edae13a76c3 HEAD -- src/modules/teste/TestModule.test.tsx src/modules/teste/databaseConnection.test.ts
      - name: Confirmar testes de sorteio da PR 9
        run: git diff --exit-code 178b7bf4fd17fdfd78b66c8b5caaf0539a42393f HEAD -- src/modules/teste/automaticDraw.integration.test.tsx
      - name: Confirmar testes de fechamento e reset da PR 10
        run: git diff --exit-code 6ab3567a93e00b034edb3604c1139638005dc8ea HEAD -- src/modules/teste/closingAndReset.rpc.test.tsx src/modules/teste/resetTestPlantao.integration.test.tsx supabase/tests/direct_closing_and_test_reset.sql
      - name: Confirmar testes da PR 11 e preservar migrações anteriores
        run: git diff --exit-code --diff-filter=DMRT cef62a818d82387453224b92d911571b6670895f HEAD -- src/modules/teste/TestCustomers.integration.test.tsx supabase/tests/test_customers_safeupdate.sql supabase/migrations
      - name: Confirmar testes e fixtures da PR 12
        run: git diff --exit-code 5d356b25ca338ba29358a92ecdab6c2c3e2d050b HEAD -- src/modules/teste/receptionChoices.test.ts src/modules/teste/receptionFixtures.ts src/modules/teste/receptionOperations.integration.test.tsx src/modules/teste/receptionOperations.rpc.test.ts supabase/tests/reception_choices.sql
      - name: Confirmar testes e rotinas restauradas da PR 13
        run: git diff --exit-code 995c29644ef6fb22e44a6adc6a552dbe67797f8c HEAD -- src/modules/teste/fiftyDecision.test.ts src/modules/teste/fiftyReception.integration.test.tsx src/lib/queueEngine.ts src/lib/reception/operationalChoices.ts src/lib/reception/operationalStore.ts src/lib/reception/returnDecision.ts src/lib/queue/shiftScheduleStore.ts src/modules/teste/virtualClock.ts
      - name: Confirmar teste da barra fixa da PR 15
        run: git diff --exit-code d46a9fae598b4526473e5dd92b3a6950db2dc646 HEAD -- src/modules/teste/stickyTimeControls.test.tsx
      - name: Preservar os 365 testes anteriores e os cinco motores
        run: |
          git diff --exit-code eb7a7ac78836439c4377b90e28346b0ead4ae2fa HEAD -- src/lib/queue/coreDistribution.ts src/lib/queue/shiftSchedule.ts src/lib/queue/pauseAndPartners.ts src/lib/reception/intake.ts src/lib/reception/fallbackOrchestrator.ts
          git diff --exit-code --diff-filter=DMRT eb7a7ac78836439c4377b90e28346b0ead4ae2fa HEAD -- 'src/**/*.test.ts' 'src/**/*.test.tsx' supabase/tests supabase/migrations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Preparar Chromium para verificar a rolagem real
        run: |
          python -m venv "$RUNNER_TEMP/crm-browser"
          "$RUNNER_TEMP/crm-browser/bin/pip" install playwright==1.51.0
          "$RUNNER_TEMP/crm-browser/bin/playwright" install --with-deps chromium
      - name: Verificar barra TESTE até o fim da página e aparência da PR 16
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: |
          git worktree add --detach "$RUNNER_TEMP/crm-before" 18d54568b843c0749e5131bae346bc0b1339191f
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/crm-before/node_modules"
          npm run dev -- --host 127.0.0.1 --port 4317 > "$RUNNER_TEMP/crm-current.log" 2>&1 &
          browser_current_pid=$!
          npm --prefix "$RUNNER_TEMP/crm-before" run dev -- --host 127.0.0.1 --port 4318 > "$RUNNER_TEMP/crm-before.log" 2>&1 &
          browser_before_pid=$!
          trap 'kill "$browser_current_pid" "$browser_before_pid" || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null http://127.0.0.1:4317
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null http://127.0.0.1:4318
          "$RUNNER_TEMP/crm-browser/bin/python" scripts/check_test_time_bar.py http://127.0.0.1:4317 http://127.0.0.1:4318
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-barra-rolagem
          path: test-results/
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Obter pg-safeupdate 1.5
        uses: actions/checkout@v4
        with:
          repository: eradman/pg-safeupdate
          ref: fbea44215425dc1092f5c98c28471eba90d0c1eb
          path: .ci/pg-safeupdate
      - name: Instalar pg-safeupdate no PostgreSQL 16
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" sh -c 'apt-get update && apt-get install -y --no-install-recommends build-essential postgresql-server-dev-16'
          docker cp .ci/pg-safeupdate "$POSTGRES_CONTAINER":/tmp/pg-safeupdate
          docker exec "$POSTGRES_CONTAINER" make -C /tmp/pg-safeupdate PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config install
      - name: Aplicar migrações e validar recepção e fechamento
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO anon, authenticated;
          SQL
          for migration in supabase/migrations/*.sql; do
            # Use the applied copies of the migration drafts duplicated by Bolt.
            case "$migration" in
              */20261113000000_*|*/20261113180000_*|*/20261113230000_*|*/20261115150000_*|*/20261115180000_*|*/20261116230000_*|*/20261118013000_*) continue ;;
            esac
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          # Every test connection loads the actual extension, including SECURITY DEFINER calls.
          export PGOPTIONS='-c session_preload_libraries=safeupdate'
          psql -f supabase/tests/test_customers_safeupdate.sql
          psql -f supabase/tests/reception_fallback.sql
          psql -f supabase/tests/automatic_draw.sql
          psql -f supabase/tests/direct_closing_and_test_reset.sql
          psql -f supabase/tests/reception_choices.sql
          psql -f supabase/tests/plantao_final_operations.sql
